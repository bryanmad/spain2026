<!doctype html>
<html lang="en">
        <head>
                <title>Voice to Text</title>
                <style>
                        * {
                                font-size: 5vh;
                        }
                        body {
                                padding: 8px 16px;
                                font-family: sans-serif;
                                min-width: 90vw;
                                min-height: 90vh;
                        }
                        button,
                        select,
                        option {
                                padding: 8px;
                                margin: 8px;
                                width: 40%;
                        }
                        #output {
                                padding: 8px;
                                margin: 8px;
                                border: 1px solid #ccc;
                                border-radius: 8px;
                                //min-height: 50%;
                                height: 15vh;
                        }
                        .scores {
                                color: blue;
                                display: inline-block;
                        }
                </style>
        </head>
        <body>
                <button id="startButton">Start</button>
                <button id="clear">Clear</button>
                <!--
                <select id="language" onchange="recognition.lang = this.value">
                        <option value="en-US">English</option>
                        <option value="hi-IN">Hindi</option>
                </select>
-->
                <div id="output" contenteditable="true"></div>

                hole 1
                <div id="score1" class="scores">0</div>
                <div></div>
                hole 2
                <div id="score2" class="scores">0</div>
                <div></div>
                hole 3
                <div id="score3" class="scores">0</div>
                <div></div>
                hole 4
                <div id="score4" class="scores">0</div>
                <div></div>
                hole 5
                <div id="score5" class="scores">0</div>
                <div></div>
                hole 6
                <div id="score6" class="scores">0</div>
                <div></div>
                hole 7
                <div id="score7" class="scores">0</div>
                <div></div>
                hole 8
                <div id="score8" class="scores">0</div>
                <div></div>
                hole 9
                <div id="score9" class="scores">0</div>

                <script>
                        const startButton = document.getElementById("startButton");
                        const outputDiv = document.getElementById("output");
                        const clearButton = document.getElementById("clear");

                        // Config
                        const LANG = "en-US";
                        clearButton.addEventListener("click", () => {
                                outputDiv.textContent = "";
                        });

                        const recognition = new (window.SpeechRecognition ||
                                window.webkitSpeechRecognition ||
                                window.mozSpeechRecognition ||
                                window.msSpeechRecognition)();

                        recognition.lang = LANG;

                        recognition.onresult = (event) => {
                                const transcript = event.results[0][0].transcript;
                                outputDiv.textContent += ` ${transcript}`;
                                // addition by me
                                var scorestext = outputDiv.textContent.replace(/\D/g, "");
                                document.getElementById("score1").innerText = scorestext.slice(0, 1);
                                document.getElementById("score2").innerText = scorestext.slice(1, 2);
                                document.getElementById("score3").innerText = scorestext.slice(2, 3);
                                document.getElementById("score4").innerText = scorestext.slice(3, 4);
                                document.getElementById("score5").innerText = scorestext.slice(4, 5);
                                document.getElementById("score6").innerText = scorestext.slice(5, 6);
                                document.getElementById("score7").innerText = scorestext.slice(6, 7);
                                document.getElementById("score8").innerText = scorestext.slice(7, 8);
                                document.getElementById("score9").innerText = scorestext.slice(8, 9);
                        };

                        recognition.onstart = () => (startButton.textContent = "Listening...");
                        recognition.onend = () => (startButton.textContent = "Start Voice Input");
                        startButton.addEventListener("click", () => recognition.start());
                </script>
        </body>
</html>
