<!doctype html>
<html lang="en">
        <head>
                <title>Voice to Text</title>
                <style>
                        * {
                                font-size: 5vh;
                        }
                        body {
                                padding: 8px 16px;
                                font-family: sans-serif;
                                min-width: 90vw;
                                min-height: 90vh;
                        }
                        button,
                        select,
                        option {
                                padding: 8px;
                                margin: 8px;
                                width: 40%;
                        }
                        #output {
                                padding: 8px;
                                margin: 8px;
                                border: 1px solid #ccc;
                                border-radius: 8px;
                                min-height: 100%;
                                height: 85vh;
                        }
                </style>
        </head>
        <body>
                <button id="startButton">Start Voice Input</button>
                <button id="clear">Clear</button>
                <!--
                <select id="language" onchange="recognition.lang = this.value">
                        <option value="en-US">English</option>
                        <option value="hi-IN">Hindi</option>
                </select>
-->
                <div id="output" contenteditable="true">Hello</div>

                <div id="score1"></div>
                <div id="score2"></div>
                <div id="score3"></div>
                <div id="score4"></div>
                <div id="score5"></div>
                <div id="score6"></div>
                <div id="score7"></div>
                <div id="score8"></div>
                <div id="score9"></div>

                <script>
                        const startButton = document.getElementById("startButton");
                        const outputDiv = document.getElementById("output");
                        const clearButton = document.getElementById("clear");

                        // Config
                        const LANG = "en-US";
                        clearButton.addEventListener("click", () => {
                                outputDiv.textContent = "";
                        });

                        const recognition = new (window.SpeechRecognition ||
                                window.webkitSpeechRecognition ||
                                window.mozSpeechRecognition ||
                                window.msSpeechRecognition)();

                        recognition.lang = LANG;

                        recognition.onresult = (event) => {
                                const transcript = event.results[0][0].transcript;
                                outputDiv.textContent += ` ${transcript}`;
                                // addition by me
                                document.getElementById("score1").innerText = transcript.slice(1, 2);
                                document.getElementById("score2").innerText = transcript.slice(2, 3);
                                document.getElementById("score3").innerText = transcript.slice(3, 4);
                                document.getElementById("score4").innerText = transcript.slice(4, 5);
                                document.getElementById("score5").innerText = transcript.slice(5, 6);
                                document.getElementById("score6").innerText = transcript.slice(6, 7);
                                document.getElementById("score7").innerText = transcript.slice(7, 8);
                                document.getElementById("score8").innerText = transcript.slice(8, 9);
                                document.getElementById("score9").innerText = transcript.slice(9, 10);
                        };

                        recognition.onstart = () => (startButton.textContent = "Listening...");
                        recognition.onend = () => (startButton.textContent = "Start Voice Input");
                        startButton.addEventListener("click", () => recognition.start());
                </script>
        </body>
</html>
