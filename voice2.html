<!doctype html>
<html lang="en">
        <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Speech Recognition - 18 Single Digits</title>
                <style>
                        body {
                                font-family: Arial, sans-serif;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                height: 100vh;
                                margin: 0;
                                background-color: #f4f4f9;
                        }
                        #display {
                                font-size: 4rem;
                                font-weight: bold;
                                color: #333;
                                margin: 20px;
                                padding: 20px;
                                border: 2px solid #ccc;
                                border-radius: 10px;
                                background: #fff;
                                min-width: 200px;
                                text-align: center;
                        }
                        #status,
                        #status2 {
                                font-size: 1.2rem;
                                color: #666;
                        }
                        button {
                                padding: 10px 20px;
                                font-size: 1rem;
                                cursor: pointer;
                                border: none;
                                background-color: #007bff;
                                color: white;
                                border-radius: 5px;
                        }
                        button:disabled {
                                background-color: #ccc;
                        }
                </style>
        </head>
        <body>
                <button id="start-btn">Start Listening</button>
                <div id="display">-</div>
                <div id="status">Click "Start Listening" and speak single digits (0-9).</div>
                <div id="status2">none</div>
                <script>
                        const startBtn = document.getElementById("start-btn");
                        const displayDiv = document.getElementById("display");
                        const statusDiv = document.getElementById("status");
                        const statusDiv2 = document.getElementById("status2");

                        // Map word numbers to digits just in case the API returns text words
                        const numberMap = {
                                zero: 0,
                                one: 1,
                                two: 2,
                                three: 3,
                                four: 4,
                                five: 5,
                                six: 6,
                                seven: 7,
                                eight: 8,
                                nine: 9
                        };

                        const targetCount = 18;
                        let accumulatedDigits = ""; // Global state to track accumulated digits across sessions
                        let isRunning = false; // Explicit flag to track if we want recognition active

                        // Check for browser support
                        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (!SpeechRecognition) {
                                statusDiv.textContent =
                                        "Speech Recognition API is not supported in this browser. Try Chrome or Edge.";
                                startBtn.disabled = true;
                        } else {
                                const recognition = new SpeechRecognition();
                                recognition.continuous = true;
                                recognition.interimResults = false;
                                recognition.lang = "en-US";

                                startBtn.addEventListener("click", () => {
                                        accumulatedDigits = ""; // Reset
                                        isRunning = true;
                                        displayDiv.textContent = "-";
                                        statusDiv.textContent = "Listening for 18 digits...";
                                        startBtn.disabled = true;
                                        recognition.start();
                                });

                                recognition.onresult = (event) => {
                                        const latestResultIndex = event.results.length - 1;
                                        const transcript = event.results[latestResultIndex][0].transcript
                                                .trim()
                                                .toLowerCase();

                                        // 1. Create a regex pattern from the object keys
                                        const pattern = new RegExp(Object.keys(numberMap).join("|"), "g");

                                        // 2. Perform the replacement
                                        const transcriptFirstCheck = transcript.replace(
                                                pattern,
                                                (match) => numberMap[match]
                                        );

                                        // 3. Keep only digits from this phrase
                                        let cleanTranscript = transcriptFirstCheck.replace(/\D/g, "");

                                        // Append new digits to our global tracker
                                        accumulatedDigits += cleanTranscript;

                                        statusDiv2.textContent = "Total digits received: " + accumulatedDigits;
                                        displayDiv.textContent = accumulatedDigits;

                                        if (accumulatedDigits.length >= targetCount) {
                                                statusDiv.textContent = `Finished! Successfully captured ${accumulatedDigits.length} digits.`;
                                                isRunning = false;
                                                recognition.stop();
                                                startBtn.disabled = false;
                                        }
                                };

                                recognition.onerror = (event) => {
                                        console.error("Speech recognition error", event.error);
                                        if (event.error === "no-speech") {
                                                statusDiv.textContent = "No speech detected. Still listening...";
                                        } else {
                                                statusDiv.textContent = `Error: ${event.error}.`;
                                                // If it's a critical error, stop attempting to auto-restart
                                                if (event.error === "not-allowed" || event.error === "audio-capture") {
                                                        isRunning = false;
                                                        startBtn.disabled = false;
                                                }
                                        }
                                };

                                recognition.onend = () => {
                                        // If it ended automatically but we haven't reached 18 digits yet, restart it
                                        if (isRunning && accumulatedDigits.length < targetCount) {
                                                statusDiv.textContent = "Resuming listening...";
                                                recognition.start();
                                        }
                                };
                        }
                </script>
        </body>
</html>
