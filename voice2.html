<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition - 18 Numbers Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }
        #number-display {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            max-width: 400px;
            min-height: 50px;
        }
        #status {
            color: #7f8c8d;
            font-style: italic;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #95a5a6;
        }
    </style>
</head>
<body>

    <h1>Number Caller (18 Limit)</h1>
    <p>Click "Start" and call out 18 numbers one by one.</p>
    
    <button id="start-btn">Start Listening</button>
    
    <!-- The div element updated with each value -->
    <div id="number-display">Waiting for numbers...</div>
    <p id="status">Status: Idle</p>

    <script>
        // Cross-browser setup for SpeechRecognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Your browser does not support the Web Speech API. Please use Google Chrome or Microsoft Edge.");
        } else {
            const recognition = new SpeechRecognition();
            const startBtn = document.getElementById('start-btn');
            const displayDiv = document.getElementById('number-display');
            const statusText = document.getElementById('status');
            
            // Array to store up to 18 captured numbers
            let capturedNumbers = [];
            const MAX_NUMBERS = 18;

            // Configure speech properties
            recognition.continuous = true; // Keep listening after single phrases
            recognition.interimResults = false; // Only want finalized phrases
            recognition.lang = 'en-US';

            startBtn.addEventListener('click', () => {
                capturedNumbers = []; // Reset array
                displayDiv.innerText = "Listening for number 1...";
                statusText.innerText = "Status: Microphone active...";
                startBtn.disabled = true;
                recognition.start();
            });

            recognition.onresult = (event) => {
                // Iterate through the newly received results
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        // Extract the transcript text string and clean it up
                        let transcript = event.results[i][0].transcript.trim();
                        
                        // Parse individual words in case multiple numbers were spoken together
                        let words = transcript.split(/\s+/);
                        
                        for (let word of words) {
                            // Extract numeric digits from the word or match textual representations
                            let cleanWord = word.replace(/[^0-9]/g, '');
                            
                            if (cleanWord !== '') {
                                let num = parseInt(cleanWord, 10);
                                processNumber(num);
                            }
                        }
                    }
                }
            };

            function processNumber(num) {
                if (capturedNumbers.length < MAX_NUMBERS) {
                    capturedNumbers.push(num);
                    
                    // Update the <div> element with the current sequence of values
                    displayDiv.innerHTML = `
                        <div style="font-size: 1.2rem; color: #7f8c8d;">
                            Count: ${capturedNumbers.length} / ${MAX_NUMBERS}
                        </div>
                        <div style="margin-top: 10px;">${capturedNumbers.join(', ')}</div>
                    `;

                    // Check if we hit the limit
                    if (capturedNumbers.length === MAX_NUMBERS) {
                        statusText.innerText = "Status: Finished! Collected 18 numbers.";
                        recognition.stop();
                    }
                }
            }

            recognition.onend = () => {
                startBtn.disabled = false;
                if (capturedNumbers.length < MAX_NUMBERS) {
                    statusText.innerText = "Status: Stopped early.";
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                statusText.innerText = `Status: Error encountered (${event.error})`;
                startBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
