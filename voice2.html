<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Digit Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        #display-box {
            font-size: 2rem;
            font-weight: bold;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            min-height: 50px;
            margin-top: 20px;
            word-break: break-all;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        #status {
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <button id="start-btn">Start Listening</button>
    <div id="status">Click the button and say single-digit numbers.</div>
    
    <!-- The div element that will be updated with each value -->
    <div id="display-box"></div>

    <script>
        // Set up cross-browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Your browser does not support the Web Speech API. Please try Google Chrome.");
        } else {
            const recognition = new SpeechRecognition();
            
            // Configure recognition rules
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            const startBtn = document.getElementById('start-btn');
            const statusText = document.getElementById('status');
            const displayBox = document.getElementById('display-box');

            let digitCount = 0;
            const targetDigits = 18;

            // Map verbal names to actual single digits
            const numberMap = {
                'zero': '0', 'oh': '0', 'one': '1', 'two': '2', 'to': '2', 'too': '2', 
                'three': '3', 'four': '4', 'for': '4', 'five': '5', 'six': '6', 
                'seven': '7', 'eight': '8', 'ate': '8', 'nine': '9'
            };

            startBtn.addEventListener('click', () => {
                digitCount = 0;
                displayBox.textContent = '';
                statusText.textContent = "Listening for 18 digits... Speak clearly.";
                recognition.start();
            });

            recognition.onresult = (event) => {
                // Get the latest transcript segment
                const currentResultIndex = event.resultIndex;
                const transcript = event.results[currentResultIndex][0].transcript.trim().toLowerCase();
                
                // Split words in case multiple numbers were stated in a single breath
                const words = transcript.split(/\s+/);

                for (let word of words) {
                    if (digitCount >= targetDigits) break;

                    let digit = '';

                    // Check if it's already a numeric character (e.g. "7")
                    if (/^[0-9]\$/.test(word)) {
                        digit = word;
                    } 
                    // Check if it's a homophone or spoken word mapped to a digit
                    else if (numberMap[word] !== undefined) {
                        digit = numberMap[word];
                    }

                    // If a valid single digit was found, append it to the div
                    if (digit !== '') {
                        displayBox.textContent += (displayBox.textContent ? ' ' : '') + digit;
                        digitCount++;
                        
                        if (digitCount >= targetDigits) {
                            statusText.textContent = `Completed! Captured ${targetDigits} digits.`;
                            recognition.stop();
                            break;
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                statusText.textContent = `Error occurred: ${event.error}`;
            };

            recognition.onend = () => {
                if (digitCount < targetDigits) {
                    statusText.textContent = "Stopped early. Click 'Start Listening' to retry.";
                }
            };
        }
    </script>
</body>
</html>
