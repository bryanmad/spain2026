<!doctype html>
<html lang="en">
        <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Speech Recognition - 18 Single Digits</title>
                <style>
                        body {
                                font-family: Arial, sans-serif;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                height: 100vh;
                                margin: 0;
                                background-color: #f4f4f9;
                        }
                        #display {
                                font-size: 4rem;
                                font-weight: bold;
                                color: #333;
                                margin: 20px;
                                padding: 20px;
                                border: 2px solid #ccc;
                                border-radius: 10px;
                                background: #fff;
                                min-width: 200px;
                                text-align: center;
                        }
                        #status {
                                font-size: 1.2rem;
                                color: #666;
                        }
                        button {
                                padding: 10px 20px;
                                font-size: 1rem;
                                cursor: pointer;
                                border: none;
                                background-color: #007bff;
                                color: white;
                                border-radius: 5px;
                        }
                        button:disabled {
                                background-color: #ccc;
                        }
                </style>
        </head>
        <body>
                <button id="start-btn">Start Listening</button>
                <div id="display">-</div>
                <div id="status">Click "Start Listening" and speak single digits (0-9).</div>

                <script>
                        const startBtn = document.getElementById("start-btn");
                        const displayDiv = document.getElementById("display");
                        const statusDiv = document.getElementById("status");

                        // Map word numbers to digits just in case the API returns text words
                        const numberMap = {
                                zero: 0,
                                one: 1,
                                two: 2,
                                three: 3,
                                four: 4,
                                five: 5,
                                six: 6,
                                seven: 7,
                                eight: 8,
                                nine: 9
                        };

                        let digitCount = 0;
                        const targetCount = 18;

                        // Check for browser support
                        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                        if (!SpeechRecognition) {
                                statusDiv.textContent =
                                        "Speech Recognition API is not supported in this browser. Try Chrome or Edge.";
                                startBtn.disabled = true;
                        } else {
                                const recognition = new SpeechRecognition();
                                recognition.continuous = true;
                                recognition.interimResults = false;
                                recognition.lang = "en-US";

                                startBtn.addEventListener("click", () => {
                                        digitCount = 0;
                                        displayDiv.textContent = "-";
                                        statusDiv.textContent = "Listening for 18 digits... Speak clearly.";
                                        startBtn.disabled = true;
                                        recognition.start();
                                });

                                recognition.onresult = (event) => {
                                        // Get the latest result
                                        const latestResultIndex = event.results.length - 1;
                                        const transcript = event.results[latestResultIndex][0].transcript
                                                .trim()
                                                .toLowerCase();

                                        // Process words or digits
                                        let cleanValue = transcript.replace(/\D/g, ""); // Clear punctuation

                                        let detectedDigit = null;
                                        if (numberMap[cleanValue] !== undefined) {
                                                detectedDigit = numberMap[cleanValue];
                                        } else if (/^\d\$/.test(cleanValue)) {
                                                detectedDigit = parseInt(cleanValue, 10);
                                        }

                                        // test
                                        statusDiv.textContent = "received: " + transcript + " " + detectedDigit;

                                        // If it's a valid single digit, update the UI
                                        if (detectedDigit !== null) {
                                                digitCount++;
                                                displayDiv.textContent = detectedDigit;
                                                statusDiv.textContent = `Digit ${digitCount} of ${targetCount} received.`;

                                                if (digitCount >= targetCount) {
                                                        statusDiv.textContent = `Finished! Successfully captured ${targetCount} single digits.`;
                                                        recognition.stop();
                                                        startBtn.disabled = false;
                                                }
                                        }
                                };

                                recognition.onerror = (event) => {
                                        console.error("Speech recognition error", event.error);
                                        if (event.error === "no-speech") {
                                                statusDiv.textContent = "No speech detected. Still listening...";
                                        } else {
                                                statusDiv.textContent = `Error: ${event.error}. Restarting...`;
                                                startBtn.disabled = false;
                                                recognition.stop();
                                        }
                                };

                                recognition.onend = () => {
                                        // Keep listening if we haven't reached 18 digits yet and it closed unexpectedly
                                        if (digitCount < targetCount && !startBtn.disabled) {
                                                recognition.start();
                                        }
                                };
                        }
                </script>
        </body>
</html>
